<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer rotating ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#logoGrad)" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner counter-rotating ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="30s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animated chart bars - white/neutral -->
  <g filter="url(#glow)">
    <rect x="38" y="108" width="10" height="38" rx="3" fill="#22c55e" opacity="0.85">
      <animate attributeName="height" values="38;44;38" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="108;102;108" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="54" y="88" width="10" height="58" rx="3" fill="#3b82f6" opacity="0.85">
      <animate attributeName="height" values="58;64;58" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="88;82;88" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="68" width="10" height="78" rx="3" fill="#60a5fa" opacity="0.85">
      <animate attributeName="height" values="78;84;78" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="68;62;68" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="86" y="48" width="10" height="98" rx="3" fill="#ffffff" opacity="0.9">
      <animate attributeName="height" values="98;104;98" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;42;48" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="102" y="56" width="10" height="90" rx="3" fill="#94a3b8" opacity="0.85">
      <animate attributeName="height" values="90;96;90" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="56;50;56" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="42" width="10" height="104" rx="3" fill="#f59e0b" opacity="0.85">
      <animate attributeName="height" values="104;110;104" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="42;36;42" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="134" y="52" width="10" height="94" rx="3" fill="#22c55e" opacity="0.85">
      <animate attributeName="height" values="94;100;94" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="52;46;52" dur="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Trend line -->
  <polyline points="43,106 59,86 75,66 91,46 107,54 123,40 139,50" 
    fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="3s" repeatCount="indefinite"/>
  </polyline>
  
  <!-- Glowing data points -->
  <circle cx="43" cy="106" r="3" fill="#22c55e" filter="url(#softGlow)">
    <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="91" cy="46" r="3" fill="#ffffff" filter="url(#softGlow)">
    <animate attributeName="r" values="2.5;4;2.5" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="139" cy="50" r="3" fill="#f59e0b" filter="url(#softGlow)">
    <animate attributeName="r" values="2.5;4;2.5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- "SX" text -->
  <text x="100" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="url(#logoGrad)" filter="url(#glow)">
    SX
  </text>
  
  <!-- Sparkle particles -->
  <circle cx="28" cy="28" r="1.2" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="172" cy="22" r="1.2" fill="#3b82f6" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="178" cy="172" r="1.2" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="22" cy="168" r="1.2" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle cx="100" cy="15" r="1" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="100" cy="185" r="1" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>
